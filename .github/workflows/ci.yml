name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SANDBOX_CREDS: ${{ secrets.CLIENT_ID != '' && secrets.CLIENT_SECRET != '' }}
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer validate
      - run: composer install --no-interaction --prefer-dist
      - name: Lint sources
        run: find lib samples tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify PHPUnit loads and discovers tests
        run: vendor/bin/phpunit --version && vendor/bin/phpunit --testsuite unit --list-tests
      - name: Sandbox integration tests (only when credentials are configured)
        if: ${{ env.HAS_SANDBOX_CREDS == 'true' }}
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: composer unit
